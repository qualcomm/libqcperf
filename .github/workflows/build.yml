name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Linux ARM64 ${{ matrix.build_type }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            build_dir: build-linux-aarch64-debug
          - build_type: Release
            build_dir: build-linux-aarch64-release

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Add Qualcomm apt repository
        run: |
          curl -fsSL https://raw.githubusercontent.com/qualcomm-linux/qcom-deb-images/main/debos-recipes/overlays/qsc-deb-releases/etc/apt/keyrings/qsc-deb-releases.asc \
            | sudo tee /etc/apt/keyrings/qsc-deb-releases.asc > /dev/null
          sudo tee /etc/apt/sources.list.d/qsc-deb-releases.sources > /dev/null <<'EOF'
          Types: deb
          URIs: https://qartifactory-edge.qualcomm.com/artifactory/qsc-deb-releases
          Suites: trixie-overlay
          Components: main
          Signed-By: /etc/apt/keyrings/qsc-deb-releases.asc
          EOF
          sudo apt-get update -q

      - name: Install FastRPC development files
        run: sudo apt-get install -y libfastrpc-dev

      - name: Configure
        run: >
          cmake -S qcperf -B ${{ matrix.build_dir }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DProjectVersion="0.1.0.0"
          -DBACKENDS="CPU;NPU"

      - name: Build
        run: cmake --build ${{ matrix.build_dir }} --parallel
