name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Linux ARM64 ${{ matrix.build_type }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            build_dir: build-linux-aarch64-debug
          - build_type: Release
            build_dir: build-linux-aarch64-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S qcperf -B ${{ matrix.build_dir }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DProjectVersion="0.1.0.0"
          -DBACKENDS="DUMMY;CPU"

      - name: Build
        run: cmake --build ${{ matrix.build_dir }} --parallel
