name: Release

# Tag-triggered release build.
# Builds QcPerfCore for both supported platforms (Linux ARM64 cross-compile and
# Windows ARM64), in both static and shared library variants, using the same
# scripts as the PR sanity-build gate. Packages each build's library + public
# headers and publishes them all to a GitHub Release for the pushed tag.
#
# Trigger: push a tag matching v<build>.<major>.<minor>.<patch>, e.g. v0.1.0.0

on:
  push:
    tags: ["v*.*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build/release (e.g. v0.1.0.0)"
        required: true

env:
  AARCH64_TOOLCHAIN_VERSION: "15.2.rel1"

jobs:
  build-linux-aarch64:
    name: Build linux-aarch64 (shared=${{ matrix.build_shared }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_shared: ["OFF", "ON"]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: true

      - name: Resolve version
        id: version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download ARM GNU Toolchain
        run: |
          set -euo pipefail
          URL="https://developer.arm.com/-/media/Files/downloads/gnu/${AARCH64_TOOLCHAIN_VERSION}/binrel/arm-gnu-toolchain-${AARCH64_TOOLCHAIN_VERSION}-x86_64-aarch64-none-linux-gnu.tar.xz"
          mkdir -p "${{ runner.temp }}/arm-gnu-toolchain"
          curl -fL "${URL}" -o /tmp/toolchain.tar.xz
          tar -xJf /tmp/toolchain.tar.xz -C "${{ runner.temp }}/arm-gnu-toolchain" --strip-components=1

      - name: Build fastrpc (libcdsprpc, required by NPU backend)
        run: |
          chmod +x qcperf/ci/build-fastrpc.sh
          qcperf/ci/build-fastrpc.sh

      - name: Build (linux-aarch64, Release, shared=${{ matrix.build_shared }})
        env:
          AARCH64_TOOLCHAIN_PATH: ${{ runner.temp }}/arm-gnu-toolchain
          PROJECT_VERSION: ${{ steps.version.outputs.version }}
          BUILD_SHARED: ${{ matrix.build_shared }}
        run: |
          chmod +x qcperf/ci/build-linux-aarch64.sh
          qcperf/ci/build-linux-aarch64.sh Release "${BUILD_SHARED}"

      - name: Package artifact
        id: package
        env:
          BUILD_SHARED: ${{ matrix.build_shared }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VARIANT="static"
          LIB_NAME="libqcperfCore.a"
          BUILD_DIR="build-linux-aarch64-release"
          if [ "${BUILD_SHARED}" = "ON" ]; then
            VARIANT="shared"
            LIB_NAME="libqcperfCore.so"
            BUILD_DIR="build-linux-aarch64-release-shared"
          fi
          NAME="qcperfCore-${VERSION}-linux-aarch64-${VARIANT}"
          STAGE_DIR="staging/${NAME}"
          mkdir -p "${STAGE_DIR}/lib" "${STAGE_DIR}/include"
          cp "${BUILD_DIR}/${LIB_NAME}" "${STAGE_DIR}/lib/"
          cp -r qcperf/core/inc/. "${STAGE_DIR}/include/"
          cp -r qcperf/backends/inc/*.h "${STAGE_DIR}/include/" 2>/dev/null || true
          tar -C staging -czf "${NAME}.tar.gz" "${NAME}"
          echo "artifact=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.artifact }}
          retention-days: 7

  build-windows-arm64:
    name: Build windows-arm64 (shared=${{ matrix.build_shared }})
    # NOTE: windows-11-arm is a GitHub-hosted ARM64 Windows runner. If it is
    # not available on this org's GitHub plan, switch to windows-latest
    # (x86_64 host cross-compiling to ARM64 via the VS ARM64 toolset still
    # works with the same script/commands).
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        build_shared: [false, true]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: true

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart("v")
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build (windows-arm64, Release, shared=${{ matrix.build_shared }})
        shell: pwsh
        env:
          PROJECT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ("${{ matrix.build_shared }}" -eq "true") {
            qcperf/ci/build-windows-arm64.ps1 -Config Release -BuildShared
          } else {
            qcperf/ci/build-windows-arm64.ps1 -Config Release
          }

      - name: Package artifact
        id: package
        shell: pwsh
        env:
          BUILD_SHARED: ${{ matrix.build_shared }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $variant = "static"
          $libName = "qcperfCore.lib"
          $buildDir = "build-windows-arm64-release"
          if ($env:BUILD_SHARED -eq "true") {
            $variant = "shared"
            $libName = "qcperfCore.dll"
            $buildDir = "build-windows-arm64-release-shared"
          }
          $name = "qcperfCore-$($env:VERSION)-windows-arm64-$variant"
          $stageDir = "staging/$name"
          New-Item -ItemType Directory -Force -Path "$stageDir/lib" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stageDir/include" | Out-Null
          Copy-Item "$buildDir/Release/$libName" "$stageDir/lib/"
          Copy-Item -Recurse "qcperf/core/inc/*" "$stageDir/include/"
          Copy-Item "qcperf/backends/inc/*.h" "$stageDir/include/" -ErrorAction SilentlyContinue
          Compress-Archive -Path $stageDir -DestinationPath "$name.zip"
          echo "artifact=$name.zip" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.artifact }}
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux-aarch64, build-windows-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes "Automated release build for ${TAG}. Contains QcPerfCore static/shared artifacts for linux-aarch64 and windows-arm64." \
            artifacts/*
